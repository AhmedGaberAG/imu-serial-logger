name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logger:
    name: Build and test C++ logger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S logger -B logger/build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build logger/build -j
      - name: Test
        run: ctest --test-dir logger/build --output-on-failure

  analysis:
    name: Test Python analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Run tests
        run: python -m pytest analysis/tests -q

  firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d firmware/esp32
